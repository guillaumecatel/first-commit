commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    biome:
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    syncpack:
      glob: "**/package.json"
      run: bun syncpack format
      stage_fixed: true
